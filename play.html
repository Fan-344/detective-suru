<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>文字試玩版</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #101214; color: #e6e6e6; font: 16px/1.6 system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif; }
      main { display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
      header { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2e33; font-size: 14px; color: #9aa3ad; }
      #log { flex: 1; overflow-y: auto; padding: 12px 0; }
      #log p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      #log p.dim { color: #7d8791; font-size: 14px; }
      #log p.echo { color: #7fb4ff; margin: 12px 0 4px; }
      #choices { display: flex; flex-direction: column; gap: 6px; max-height: 45dvh; overflow-y: auto; padding: 10px 0 12px; border-top: 1px solid #2a2e33; }
      button { font: inherit; text-align: left; color: inherit; background: #1b1f24; border: 1px solid #2f353c; border-radius: 8px; padding: 10px 12px; }
      button:active { background: #262c33; }
    </style>
  </head>
  <body>
    <main>
      <header><span>文字試玩版</span><span id="battery"></span></header>
      <div id="log"></div>
      <div id="choices"></div>
    </main>
    <script type="module" src="/src/play/web.ts"></script>
  </body>
</html>
